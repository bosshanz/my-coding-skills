# Text-only checks for optional capabilities; no real tools or files.
# These assertions screen scope/evidence signals, not runtime behavior.

- id: verify-diagnosis-stops
  skill: verify
  scenario: |
    Simulated repo: an e-commerce checkout flow (cart -> coupon -> pay).
    CONTEXT.md exists and describes the 下单 journey in Chinese. No files
    have been changed and you have made no edits.
  user: $verify 诊断第一次下单这条真实用法，只回答被问的这一刀
  must_contain:
    - 下单
  must_not_contain:
    - 已新增
    - 已修改
    - 已保护
  must_match:
    - (证据|未验证|无法|不能|缺少)
- id: verify-coverage-stays-in-track
  skill: verify
  scenario: |
    Simulated repo: inventory deduction lives in OrderService.deduct() and is
    covered only by a mocked unit test. The business rule is clear: stock and
    orders must never silently disagree. The user has now asked for protection.
  user: $verify 保护库存扣减这条业务规则
  must_contain: []
  must_not_contain:
    - accepted
    - rejected
  must_match:
    - (库存|stock)
    - (mock|模拟|真实存储|数据库|集成)
    - (无法|未.*(验证|执行|运行)|缺.*(证据|工具)|不能)
- id: verify-acceptance-verdict-enum
  skill: verify
  scenario: |
    Simulated repo: yesterday's login fix touched src/auth/token.ts with a
    unit test added and passing. No manual verification, no CI run recorded.
  user: 对这次登录修复做最终验收，给出结论
  must_contain: []
  must_not_contain: []
  must_match:
    - \b(accepted with risk|accepted|rejected)\b
    - (单元测试|unit.*test)
    - (未|缺|无).*(CI|手工|人工|端到端|证据|验证)
- id: design-interaction-delivery
  skill: design
  scenario: |
    Simulated repo: an internal publishing tool has a bulk publish action.
    The current UI jumps from selection to a generic spinner, cannot explain
    partial failure, and loses the selection after retry. The user wants a
    design proposal only, before implementation.
  user: $design 重新设计批量发布的交互，不要先做视觉稿
  must_contain: []
  must_not_contain: []
  must_match:
    - (部分失败|partial failure|失败项)
    - (保留|保持|恢复).*(选择|选中|勾选)
    - (重试|retry)
- id: reflect-authorized-entry-no-repeat-confirmation
  skill: reflect
  scenario: "Simulated project: CLAUDE.md has a Taste section. No tools or writes
    are available. The user explicitly authorizes the exact preference and
    destination."
  user: $reflect 把“本项目使用 pnpm，不使用 npm”记录到 CLAUDE.md 的 Taste 段；这条内容和落点我都确认了。
  must_contain:
    - pnpm
    - CLAUDE.md
  must_not_contain:
    - 已写入
    - 已新增
    - 请确认
    - 是否确认
  must_match:
    - (无法|不能|工具|不可用|unavailable)
- id: verify-missing-required-check
  skill: verify
  scenario: The implementation criterion requires an integration check against the
    actual database. Only mocked unit tests ran; there is no database access in
    this simulation.
  user: 对这次库存修复做最终验收。真实数据库集成检查是必需项。
  expected_verdict: rejected
  review_notes: 必需数据库检查未执行，应说明缺少必需证据；不能因模拟单测通过而放行，也不能声称已运行检查。
  must_not_contain:
    - 已通过最终验收
  must_match:
    - (数据库|database)
- id: verify-acceptance-evidence-sufficient
  skill: verify
  scenario: |-
    This is a supplied, completed verification record for a one-line copy change.
    The agreed criterion is exact corrected wording in the rendered page. The
    reviewed diff changes only that wording. The page was rendered after the
    change and the text was inspected at normal and narrow widths; the required
    project checks passed. There are no unresolved failures or required checks.
    Treat this record as the available evidence; no tools exist in this eval.
  user: 根据这份记录对文案修复做最终验收，给出结论。
  expected_verdict: accepted
  review_notes: 已给出的证据覆盖本次可见文案标准和项目必需检查；不应臆造阻塞项，也不应声称自己亲自运行过检查。
  must_match:
    - (文案|文字|wording|copy)
    - (渲染|页面|render)
- id: verify-acceptance-nonblocking-risk
  skill: verify
  scenario: |-
    The agreed criterion is that a draft survives switching between two accounts
    in the supported desktop browser. A supplied run shows the draft persisted,
    switching back restored it, the required project checks passed, and there is
    no required check outstanding. An older unsupported browser was not tested;
    the team has explicitly classified that compatibility question as a
    nonblocking risk for this release. No tools exist in this eval.
  user: 按已约定范围验收草稿切换，保留并说明剩余风险。
  expected_verdict: accepted with risk
  review_notes: 必需标准已有证据，旧浏览器属于已明确的非阻塞风险；不能把未测可选场景升级为阻塞项，也不能隐去风险。
  must_match:
    - (草稿|draft)
    - (旧|不支持|unsupported|older).*(浏览器|browser)
- id: verify-product-contract-conflicts-with-code
  skill: verify
  scenario: |-
    Current confirmed product rule in docs/product.md: retry only failed items
    after a partial bulk publish. The architecture note describes an idempotent
    per-item retry mechanism. Current code instead sends the entire batch again;
    an old test asserts this implementation behavior. No tools exist in this eval.
  user: $verify 诊断批量发布重试是否符合当前约定，只说明能从这些材料判断的内容。
  review_notes: 已确认的产品规则优先定义预期，架构解释实现机制，代码和旧测试说明现状；应指出冲突与可能重复发布，不能用旧测试证明产品行为正确。
  must_match:
    - (失败项|failed items|failed)
    - (整批|全部|entire batch|whole batch)
    - (冲突|不符|偏差|conflict|mismatch)
  must_not_contain:
    - 已执行真实重试
- id: verify-missing-document-does-not-block
  skill: verify
  scenario: |-
    This small project has no product or architecture document. The user supplied
    a clear current rule: cancelling an unsubmitted form must leave saved data
    unchanged. Existing code and a mocked unit test are visible in the supplied
    record. No execution tools exist in this eval.
  user: $verify 根据这个规则安排能做的检查，指出还缺什么证据。
  review_notes: 应以用户给出的规则为预期继续追踪取消到写入边界；可以标出真实持久化证据缺口，不要求先新建两份文档。
  must_match:
    - (取消|cancel)
    - (持久化|写入|存储|database|storage)
  must_not_contain:
    - 必须先创建产品设计文档
    - 必须先创建架构文档
- id: verify-out-of-order-search
  skill: verify
  references:
    - references/scenarios.md
  scenario: |-
    A user types A, then B into search. Request B returns first with B results;
    request A returns later. The agreed behavior is that the visible list follows
    the latest query B. Only a mocked single-request success test exists. No
    tools are available in this eval.
  user: $verify 为这次搜索结果竞态选一个代表性检查并说明观察点。
  review_notes: 应构造 A 晚于 B 返回的顺序，观察最终列表仍是 B；单请求测试不能覆盖乱序，不能声称已实际复现。
  must_match:
    - (A).*(B)
    - (晚|迟|后|late|after)
    - (结果|列表|results|list)
  must_not_contain:
    - 已复现竞态
- id: verify-isolated-reproduction
  skill: verify
  references:
    - references/scenarios.md
  scenario: |-
    A payment provider times out after accepting a request. The product criterion
    is one order and one charge even if the client retries. A sandbox provider
    and disposable database can be used later, but this text-only eval has no
    tools. A mocked timeout unit test does not exercise provider or database
    uniqueness.
  user: $verify 说明如何隔离复现、观察什么，以及当前能得出什么结论。
  review_notes: 应用沙箱与临时数据重放响应丢失和重复请求，观察权威订单及扣款记录；当前只能给验证方案与证据缺口，不能声称实际操作或默认授权生产支付。
  must_match:
    - (沙箱|sandbox)
    - (临时|隔离|disposable|isolated)
    - (订单|order).*(扣款|支付|charge|payment)
  must_not_contain:
    - 已完成真实支付
- id: verify-review-only-stays-read-only
  skill: verify
  scenario: No tools are available. The user asks only for diagnosis of draft loss
    during account switching, with no permission to edit files.
  user: $verify 只诊断切换账号时草稿会不会丢，不要修改代码或测试。
  must_not_contain:
    - 已新增
    - 已修改
    - 已修复
  must_match:
    - (草稿|draft)
    - (证据|无法|未验证|缺少)
- id: verify-resume-authorized-repair
  skill: verify
  scenario: The user previously authorized diagnosis and repair of duplicate
    inventory deduction. Diagnosis is now complete. No tools are available in
    this simulation, so no implementation can be claimed.
  user: 按已确定的幂等方案继续修复，不用再确认。
  must_not_contain:
    - 请确认方案
    - 是否开始实施
    - 已完成修复
    - $dev
  must_match:
    - (工具|无法|不可用|unavailable)
- id: grill-me-known-context-one-decision
  skill: grill-me
  scenario: |
    The user wants an offline draft feature. Existing facts: web app, server drafts,
    three engineers, six-week deadline. No decision yet about the first offline action.
    No tools or writes are available.
  user: $grill-me 帮我推敲离线编辑方案，一次只问一个关键问题。
  must_match:
    - (离线|offline)
    - (优先|首先|第一|最关键|首期)
  must_not_contain:
    - 请回答以下
    - 几个工程师
    - 已实现
- id: grill-me-user-stops
  skill: grill-me
  scenario: |
    Interview so far: first release allows editing existing drafts, not creating
    offline drafts. Conflicts use manual choice, but reconnect recovery is untested.
  user: 不用继续问了，总结当前决定和未验证项，不要实施。
  must_match:
    - (已有|现有).*(草稿)
    - (未验证|待验证|未测试)
  must_not_contain:
    - 请问
    - 已实现
- id: reflect-repository-default
  skill: reflect
  scenario: |
    A real check in the supplied task record showed that this repository's CLI v2
    rejects --legacy; installed help confirms --current works. Host allows local
    project learning writes. No learning log exists. No actual tools are available
    in this text-only evaluation, so only propose an entry, never claim a write.
  user: 你又用了旧参数，这次总结一下经验，之后别再犯。
  must_contain:
    - .agent-learning.md
  must_match:
    - (v2|版本)
    - (未.*(写入|保存)|无法|不能)
  must_not_contain:
    - 已写入
    - ~/self-improving
- id: reflect-host-persistence-limit
  skill: reflect
  scenario: |
    Host permits persistent memory only when explicitly requested. A save indicator
    preceded database acknowledgement; a refresh regression test now passes after
    awaiting acknowledgement. User requests reflection but no persistence.
  user: $reflect 复盘一下这次修复，不要保存记忆。
  must_match:
    - (确认|acknowledg|持久化)
    - (测试|证据)
  must_not_contain:
    - 已记录
    - 已保存
    - 请确认
- id: reflect-repetition-is-not-proof
  skill: reflect
  scenario: |
    Three retries of the same request timed out. There are no server logs or
    independent observations. No tools or writes are available.
  user: $reflect 这能证明服务商不可靠吗？总结经验。
  must_match:
    - (不能|不足|无法).*(证明|断定|判断)
    - (假设|待验证|不确定|更多证据)
  must_not_contain:
    - 已写入
- id: eng-no-speculative-framework
  skill: eng
  scenario: |
    当前导出只有一种 CSV 格式，现有函数可以满足需求，没有第二种格式、
    插件扩展或隔离测试要求。没有工具，当前只需判断取舍。
  user: $eng 要不要为了最佳实践先加一个导出插件注册表和抽象工厂？
  must_match:
    - (不需要|不建议|没必要|无需|不应)
    - (现有|当前|复用)
  must_not_contain:
    - 已新增
    - 已创建
- id: eng-necessary-boundary
  skill: eng
  scenario: |
    一个函数同时处理网络传输、重试和响应解析。虽然只有一个调用方，
    但无法独立重放解析故障，测试每次都要请求真实服务。
    将传输与解析分开即可离线重放，不需要引入新服务或插件系统。
  user: $eng 如无必要勿增实体，是不是只有一个调用方就不能拆分？只讨论方案。
  must_match:
    - (隔离|边界|分离|拆分)
    - (测试|重放)
    - (不能仅|不等于|不是|不必|可以|有必要|合理)
  must_not_contain:
    - 已修改
- id: eng-simplicity-preserves-invariant
  skill: eng
  scenario: |
    数据库唯一约束阻止重复支付回调造成重复订单。应用层虽然先查询再插入，
    但两个并发请求仍可能同时通过查询。当前只读讨论，没有执行工具。
  user: $eng 为了减少实体，把这个唯一约束删除，只留应用检查怎么样？
  must_match:
    - (并发|竞态)
    - (唯一约束|唯一性约束)
    - (保留|不能|不应|不建议)
  must_not_contain:
    - 已删除

# 成对案例：仅改变决定所依赖的约束。必须结合 review_notes 复核实际方案；
# 选择词和正则只是筛查，不能证明决策合理或 references 有效。
- id: eng-decision-abstraction-independent
  skill: eng
  scenario: |-
    两个导出入口各有一段看起来相同的舍入逻辑。当前只讨论方案，没有工具。
    两段逻辑分别遵循不同合同，允许独立变更；没有共同不变量。
  user: $eng 请选择“保留独立实现”或“集中共同规则”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 前者不能因外形相似强行共享；后者应集中实际规则而非仅共享函数名，不需要插件框架。
  must_match:
    - '^结论[：:]\s*保留独立实现(?:\r?\n|$)'
    - (不同|独立)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-abstraction-shared
  skill: eng
  scenario: |-
    两个导出入口各有一段看起来相同的舍入逻辑。当前只讨论方案，没有工具。
    两段逻辑遵循同一合同，任何修改都必须一致；目前已出现一处更新另一处遗漏。
  user: $eng 请选择“保留独立实现”或“集中共同规则”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 前者不能因外形相似强行共享；后者应集中实际规则而非仅共享函数名，不需要插件框架。
  must_match:
    - '^结论[：:]\s*集中共同规则(?:\r?\n|$)'
    - (一致|遗漏)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-state-online
  skill: eng
  scenario: |-
    编辑器已有服务器权威文档和持久化确认，正在决定是否新增本地可写草稿。当前只讨论方案，没有工具。
    产品只允许在线编辑；现有请求内状态已满足交互，未发现延迟或恢复缺口。
  user: $eng 请选择“复用现有状态”或“增加本地草稿”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 前者避免新增持久化副本；后者允许独立草稿生命周期，但必须处理同步冲突且不能把本地保存称为服务器提交。
  must_match:
    - '^结论[：:]\s*复用现有状态(?:\r?\n|$)'
    - (现有|重复)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-state-offline
  skill: eng
  scenario: |-
    编辑器已有服务器权威文档和持久化确认，正在决定是否新增本地可写草稿。当前只讨论方案，没有工具。
    产品明确要求断网后编辑并在重启后恢复，联网时必须识别与服务器版本的冲突。
  user: $eng 请选择“复用现有状态”或“增加本地草稿”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 前者避免新增持久化副本；后者允许独立草稿生命周期，但必须处理同步冲突且不能把本地保存称为服务器提交。
  must_match:
    - '^结论[：:]\s*增加本地草稿(?:\r?\n|$)'
    - (版本|冲突)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-fallback-browse
  skill: eng
  scenario: |-
    库存接口暂时失败，手上有十分钟前的缓存和采集时间。当前只讨论方案，没有工具。
    此结果只用于浏览，产品明确允许十五分钟内的陈旧结果并要求展示时间，不驱动下单。
  user: $eng 请选择“展示标时缓存”或“返回无法确认”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 同样的缓存应因使用契约不同得到不同选择；不可声称缓存能保证当前预留，也不可对允许陈旧的浏览一律拒绝。
  must_match:
    - '^结论[：:]\s*展示标时缓存(?:\r?\n|$)'
    - (时间|陈旧)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-fallback-reserve
  skill: eng
  scenario: |-
    库存接口暂时失败，手上有十分钟前的缓存和采集时间。当前只讨论方案，没有工具。
    此结果用于最终库存预留，契约要求当前可用库存，不能以缓存决定是否承诺成功。
  user: $eng 请选择“展示标时缓存”或“返回无法确认”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 同样的缓存应因使用契约不同得到不同选择；不可声称缓存能保证当前预留，也不可对允许陈旧的浏览一律拒绝。
  must_match:
    - '^结论[：:]\s*返回无法确认(?:\r?\n|$)'
    - (当前|预留)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-compatibility-active
  skill: eng
  scenario: |-
    旧字段准备被新字段替换，当前任务明确授权完成字段迁移。当前只讨论方案，没有工具。
    完整使用方清单确认，仍有受支持的客户端只识别旧字段；本次要求它们继续可用。
  user: $eng 请选择“保留过渡兼容”或“移除旧路径”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 前者保证混合版本可用并有退役条件；后者不因抽象兼容原则永久保留死路径。“测试全绿”不能替代消费方证据。
  must_match:
    - '^结论[：:]\s*保留过渡兼容(?:\r?\n|$)'
    - (客户端|使用方)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-compatibility-retired
  skill: eng
  scenario: |-
    旧字段准备被新字段替换，当前任务明确授权完成字段迁移。当前只讨论方案，没有工具。
