# Text-only checks for optional capabilities; no real tools or files.
# These assertions screen scope/evidence signals, not runtime behavior.

- id: verify-diagnosis-stops
  skill: verify
  scenario: |
    Simulated repo: an e-commerce checkout flow (cart -> coupon -> pay).
    CONTEXT.md exists and describes the 下单 journey in Chinese. No files
    have been changed and you have made no edits.
  user: $verify 诊断第一次下单这条真实用法，只回答被问的这一刀
  must_contain:
    - 下单
  must_not_contain:
    - 已新增
    - 已修改
    - 已保护
  must_match:
    - (证据|未验证|无法|不能|缺少)
- id: verify-coverage-stays-in-track
  skill: verify
  scenario: |
    Simulated repo: inventory deduction lives in OrderService.deduct() and is
    covered only by a mocked unit test. The business rule is clear: stock and
    orders must never silently disagree. The user has now asked for protection.
  user: $verify 保护库存扣减这条业务规则
  must_contain: []
  must_not_contain:
    - accepted
    - rejected
  must_match:
    - (库存|stock)
    - (mock|模拟|真实存储|数据库|集成)
    - (无法|未.*(验证|执行|运行)|缺.*(证据|工具)|不能)
- id: verify-acceptance-verdict-enum
  skill: verify
  scenario: |
    Simulated repo: yesterday's login fix touched src/auth/token.ts with a
    unit test added and passing. No manual verification, no CI run recorded.
  user: 对这次登录修复做最终验收，给出结论
  must_contain: []
  must_not_contain: []
  must_match:
    - \b(accepted with risk|accepted|rejected)\b
    - (单元测试|unit.*test)
    - (未|缺|无).*(CI|手工|人工|端到端|证据|验证)
- id: adapter-claude-unavailable
  skill: external-cli
  scenario: |
    Environment note: the `claude` executable is NOT installed on this
    machine and no Claude Code session exists. You cannot invoke it.
  user: 让 Claude Code 审一下当前 diff
  must_contain: []
  must_not_contain:
    - Claude Code 已完成审查
  must_match:
    - (不可用|无法.{0,4}(调用|派发|分发|执行|运行|invoke)|(不|未|没有|无).{0,6}(安装|存在|找到|可执行)|缺失|未能|not installed|unavailable|cannot (be )?invoked?|not available|missing)
- id: adapter-kimi-unavailable
  skill: external-cli
  scenario: |
    Environment note: the `kimi` executable is NOT installed on this machine.
    You cannot invoke Kimi Code.
  user: 让 Kimi Code 研究一下这个仓库的架构
  must_contain: []
  must_not_contain:
    - Kimi Code 已完成研究
  must_match:
    - (不可用|无法.{0,4}(调用|派发|分发|执行|运行|invoke)|(不|未|没有|无).{0,6}(安装|存在|找到|可执行)|缺失|未能|not installed|unavailable|cannot (be )?invoked?|not available|missing)
- id: design-interaction-delivery
  skill: design
  scenario: |
    Simulated repo: an internal publishing tool has a bulk publish action.
    The current UI jumps from selection to a generic spinner, cannot explain
    partial failure, and loses the selection after retry. The user wants a
    design proposal only, before implementation.
  user: $design 重新设计批量发布的交互，不要先做视觉稿
  must_contain: []
  must_not_contain: []
  must_match:
    - (部分失败|partial failure|失败项)
    - (保留|保持|恢复).*(选择|选中|勾选)
    - (重试|retry)
- id: reflect-authorized-entry-no-repeat-confirmation
  skill: reflect
  scenario: "Simulated project: CLAUDE.md has a Taste section. No tools or writes
    are available. The user explicitly authorizes the exact preference and
    destination."
  user: $reflect 把“本项目使用 pnpm，不使用 npm”记录到 CLAUDE.md 的 Taste 段；这条内容和落点我都确认了。
  must_contain:
    - pnpm
    - CLAUDE.md
  must_not_contain:
    - 已写入
    - 已新增
    - 请确认
    - 是否确认
  must_match:
    - (无法|不能|工具|不可用|unavailable)
- id: verify-missing-required-check
  skill: verify
  scenario: The implementation criterion requires an integration check against the
    actual database. Only mocked unit tests ran; there is no database access in
    this simulation.
  user: 对这次库存修复做最终验收。真实数据库集成检查是必需项。
  must_contain:
    - rejected
  must_not_contain:
    - 已通过最终验收
  must_match:
    - (数据库|database)
- id: verify-review-only-stays-read-only
  skill: verify
  scenario: No tools are available. The user asks only for diagnosis of draft loss
    during account switching, with no permission to edit files.
  user: $verify 只诊断切换账号时草稿会不会丢，不要修改代码或测试。
  must_not_contain:
    - 已新增
    - 已修改
    - 已修复
  must_match:
    - (草稿|draft)
    - (证据|无法|未验证|缺少)
- id: verify-resume-authorized-repair
  skill: verify
  scenario: The user previously authorized diagnosis and repair of duplicate
    inventory deduction. Diagnosis is now complete. No tools are available in
    this simulation, so no implementation can be claimed.
  user: 按已确定的幂等方案继续修复，不用再确认。
  must_not_contain:
    - 请确认方案
    - 是否开始实施
    - 已完成修复
    - $dev
  must_match:
    - (工具|无法|不可用|unavailable)
- id: grill-me-known-context-one-decision
  skill: grill-me
  scenario: |
    The user wants an offline draft feature. Existing facts: web app, server drafts,
    three engineers, six-week deadline. No decision yet about the first offline action.
    No tools or writes are available.
  user: $grill-me 帮我推敲离线编辑方案，一次只问一个关键问题。
  must_match:
    - (离线|offline)
    - (优先|首先|第一|最关键|首期)
  must_not_contain:
    - 请回答以下
    - 几个工程师
    - 已实现
- id: grill-me-user-stops
  skill: grill-me
  scenario: |
    Interview so far: first release allows editing existing drafts, not creating
    offline drafts. Conflicts use manual choice, but reconnect recovery is untested.
  user: 不用继续问了，总结当前决定和未验证项，不要实施。
  must_match:
    - (已有|现有).*(草稿)
    - (未验证|待验证|未测试)
  must_not_contain:
    - 请问
    - 已实现
- id: reflect-repository-default
  skill: reflect
  scenario: |
    A real check in the supplied task record showed that this repository's CLI v2
    rejects --legacy; installed help confirms --current works. Host allows local
    project learning writes. No learning log exists. No actual tools are available
    in this text-only evaluation, so only propose an entry, never claim a write.
  user: 你又用了旧参数，这次总结一下经验，之后别再犯。
  must_contain:
    - .agent-learning.md
  must_match:
    - (v2|版本)
    - (未.*(写入|保存)|无法|不能)
  must_not_contain:
    - 已写入
    - ~/self-improving
- id: reflect-host-persistence-limit
  skill: reflect
  scenario: |
    Host permits persistent memory only when explicitly requested. A save indicator
    preceded database acknowledgement; a refresh regression test now passes after
    awaiting acknowledgement. User requests reflection but no persistence.
  user: $reflect 复盘一下这次修复，不要保存记忆。
  must_match:
    - (确认|acknowledg|持久化)
    - (测试|证据)
  must_not_contain:
    - 已记录
    - 已保存
    - 请确认
- id: reflect-repetition-is-not-proof
  skill: reflect
  scenario: |
    Three retries of the same request timed out. There are no server logs or
    independent observations. No tools or writes are available.
  user: $reflect 这能证明服务商不可靠吗？总结经验。
  must_match:
    - (不能|不足|无法).*(证明|断定|判断)
    - (假设|待验证|不确定|更多证据)
  must_not_contain:
    - 已写入
- id: eng-no-speculative-framework
  skill: eng
  scenario: |
    当前导出只有一种 CSV 格式，现有函数可以满足需求，没有第二种格式、
    插件扩展或隔离测试要求。没有工具，当前只需判断取舍。
  user: $eng 要不要为了最佳实践先加一个导出插件注册表和抽象工厂？
  must_match:
    - (不需要|不建议|没必要|无需|不应)
    - (现有|当前|复用)
  must_not_contain:
    - 已新增
    - 已创建
- id: eng-necessary-boundary
  skill: eng
  scenario: |
    一个函数同时处理网络传输、重试和响应解析。虽然只有一个调用方，
    但无法独立重放解析故障，测试每次都要请求真实服务。
    将传输与解析分开即可离线重放，不需要引入新服务或插件系统。
  user: $eng 如无必要勿增实体，是不是只有一个调用方就不能拆分？只讨论方案。
  must_match:
    - (隔离|边界|分离|拆分)
    - (测试|重放)
    - (不能仅|不等于|不是|不必|可以|有必要|合理)
  must_not_contain:
    - 已修改
- id: eng-simplicity-preserves-invariant
  skill: eng
  scenario: |
    数据库唯一约束阻止重复支付回调造成重复订单。应用层虽然先查询再插入，
    但两个并发请求仍可能同时通过查询。当前只读讨论，没有执行工具。
  user: $eng 为了减少实体，把这个唯一约束删除，只留应用检查怎么样？
  must_match:
    - (并发|竞态)
    - (唯一约束|唯一性约束)
    - (保留|不能|不应|不建议)
  must_not_contain:
    - 已删除
