    and --current works. No other path is registered in project rules.
    No actual tools are available in this text-only evaluation, so never
    claim a write. The user wants prior lessons applied, not a new location.
  user: 这次既要改草稿保存提示，也要用到本地 CLI，先根据已有经验说说该注意什么，先别写入新条目。
  must_contain:
    - .agent-learning.md
    - .agent-learning.local.md
  must_match:
    - (持久化|确认|acknowledg)
    - (v2|--legacy|--current|旧参数)
  must_not_contain:
    - 已写入
    - 请选择
    - 放在哪里？
    - 放在哪？
- id: reflect-worktree-private-log-in-main
  skill: reflect
  scenario: |
    Host allows local project learning writes. The session runs in a linked
