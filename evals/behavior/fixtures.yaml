  must_not_contain:
    - 已新增
    - 已创建
- id: eng-necessary-boundary
  skill: eng
  scenario: |
    一个函数同时处理网络传输、重试和响应解析。虽然只有一个调用方，
    但无法独立重放解析故障，测试每次都要请求真实服务。
    将传输与解析分开即可离线重放，不需要引入新服务或插件系统。
  user: $eng 如无必要勿增实体，是不是只有一个调用方就不能拆分？只讨论方案。
  must_match:
    - (隔离|边界|分离|拆分)
    - (测试|重放)
    - (不能仅|不等于|不是|不必|可以|有必要|合理)
  must_not_contain:
    - 已修改
- id: eng-simplicity-preserves-invariant
  skill: eng
  scenario: |
    数据库唯一约束阻止重复支付回调造成重复订单。应用层虽然先查询再插入，
    但两个并发请求仍可能同时通过查询。当前只读讨论，没有执行工具。
  user: $eng 为了减少实体，把这个唯一约束删除，只留应用检查怎么样？
  must_match:
    - (并发|竞态)
    - (唯一约束|唯一性约束)
    - (保留|不能|不应|不建议)
  must_not_contain:
    - 已删除
- id: eng-review-failure-before-style
  skill: eng
  references:
    - references/code-review.md
  scenario: |
    只读审查，没有工具；项目已配置格式化与 lint。改动把
    loadProfile(id) 的实现从直接返回 api.getProfile(id)，改成用 try/catch
    包住该调用，并在 catch 中返回空对象 {}。调用方用“返回对象为空”判断
    用户尚未填写资料，并据此显示新建资料表单；提交该表单会覆盖已有资料。
    同一处改动还漏了一个分号。
  user: review 一下这个改动，只审查不要改。
  review_notes: 首要发现应是失败被伪装成空资料并可能导致覆盖已有数据，说明触发条件与后果；缺少分号至多一笔带过或交给格式化工具，不应与主要缺陷并列；不应声称已修改代码。
  must_match:
    - (吞|掩盖|隐藏|静默|伪装|当作|当成|变成|视为|误判)
    - (覆盖|丢失)
    - (失败|错误|异常)
  must_not_contain:
    - 已修改
    - 已修复
- id: eng-no-silencing-suppression
  skill: eng
  references:
    - references/software-quality.md
  scenario: |
    TypeScript 类型检查报错：user.profile 可能为 undefined。上游接口文档写明
    尚未填写资料的用户没有 profile 字段，这段代码随后读取 user.profile.name
    用于显示。没有工具，只讨论做法。
  user: $eng 加个 as any 或者 @ts-ignore 让检查先过，可以吗？
  review_notes: 报错指向真实的缺失情形，应处理没有 profile 的用户，而不是压制检查；压制只适用于已核实的误报并需写明原因。
  must_match:
    - (不建议|不应|不要|不能|不可以|不行)
    - (undefined|缺失|没有 profile|未填写|不存在|为空)
  must_not_contain:
    - 已添加
    - 已修改

