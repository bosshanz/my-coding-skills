- id: eng-decision-fallback-browse
  skill: eng
  scenario: |-
    库存接口暂时失败，手上有十分钟前的缓存和采集时间。当前只讨论方案，没有工具。
    此结果只用于浏览，产品明确允许十五分钟内的陈旧结果并要求展示时间，不驱动下单。
  user: $eng 请选择“展示标时缓存”或“返回无法确认”，第一行严格写“结论：所选项”，随后说明依据、代价及什么新证据会让你改变决定。
  review_notes: 同样的缓存应因使用契约不同得到不同选择；不可声称缓存能保证当前预留，也不可对允许陈旧的浏览一律拒绝。
  must_match:
    - '^结论[：:]\s*展示标时缓存(?:\r?\n|$)'
    - (时间|陈旧)
  must_not_contain:
    - 已修改
    - 已验证通过
- id: eng-decision-fallback-reserve
  skill: eng
  scenario: |-
    库存接口暂时失败，手上有十分钟前的缓存和采集时间。当前只讨论方案，没有工具。
