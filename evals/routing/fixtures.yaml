# Routing eval fixtures (L1).
#
# Each fixture simulates one user message and the skill(s) it must route to.
# Discipline: a real mis-trigger becomes a fixture in the same session it was
# noticed. `source` names the commit or design decision that motivated it.
#
# Fields:
#   id         unique slug
#   prompt     the simulated user message
#   expect     expected skills; [none] means no skill should trigger
#   strict     true  -> strong-model mismatch fails the run
#              false -> strong-model mismatch is a warning only
#   rationale  why this expectation holds
#   source     motivating commit or "design"

# --- dev: default dispatcher (CN + EN, feature + bug) ---

- id: dev-feature-filter-cn
  prompt: "帮我给用户列表加一个按角色筛选的功能"
  expect: [dev]
  strict: true
  rationale: "Ordinary new requirement, default dispatcher."
  source: design

- id: dev-feature-pagination-en
  prompt: "Add pagination to the orders API"
  expect: [dev]
  strict: true
  rationale: "Ordinary new requirement in English."
  source: design

- id: dev-bug-500-cn
  prompt: "修一下这个登录偶发 500 的 bug"
  expect: [dev]
  strict: true
  rationale: "Bug fix track."
  source: design

- id: dev-bug-npe
  prompt: "这里偶尔空指针，帮我排查修复"
  expect: [dev]
  strict: true
  rationale: "Bug fix track with reproduction-first wording."
  source: design

- id: dev-bare-e2e
  prompt: "给下单流程补点 e2e 测试"
  expect: [dev]
  strict: true
  rationale: "Bare request to add e2e/regression/tests stays in dev."
  source: 2947557

- id: dev-refactor
  prompt: "把这段重复代码提取成公共函数"
  expect: [dev]
  strict: true
  rationale: "Ordinary implementation work."
  source: design

- id: dev-csv-export
  prompt: "新需求：支持把账单导出成 CSV"
  expect: [dev]
  strict: true
  rationale: "Explicit new requirement."
  source: design

- id: dev-money-feature
  prompt: "帮我实现优惠券核销功能"
  expect: [dev]
  strict: true
  rationale: "Money/business-relevant implementation still stays in dev."
  source: 99a1cae

- id: dev-trivial-css
  prompt: "把这个按钮的边距调小一点"
  expect: [dev]
  strict: false
  rationale: "Trivial tweak; dev handles it without the design skill."
  source: design

# --- none: generic looks, chat, methodology ---

- id: none-weather
  prompt: "今天上海天气怎么样"
