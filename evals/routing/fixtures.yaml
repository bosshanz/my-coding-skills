# --- qa: opt-in business / real-usage pass ---

- id: qa-explicit-dollar
  prompt: "$qa 走一遍首次下单的真实用法，只诊断不改代码"
  expect: [qa]
  strict: true
  rationale: "Explicit invocation, diagnosis track."
  source: baae915

- id: qa-slash-diagnose
  prompt: "/qa 诊断这条退款旅程哪里会坑用户"
  expect: [qa]
  strict: true
  rationale: "Explicit invocation, named journey."
  source: 2947557

- id: qa-thinking
  prompt: "用 QA 思维检查一下优惠码这条业务规则会不会静默坏掉"
  expect: [qa]
  strict: true
  rationale: "Explicit QA-thinking ask on a named rule."
  source: 2947557

- id: qa-business-test
  prompt: "业务测试一下购物车合并逻辑"
  expect: [qa]
  strict: true
  rationale: "Explicit business-testing ask."
  source: baae915

- id: qa-protect-rule
  prompt: "保护一下库存扣减这条业务规则，别让它静默坏掉"
  expect: [qa]
  strict: true
  rationale: "Explicit protection ask on a named rule."
  source: a20f32c

- id: qa-journey-diagnosis
  prompt: "诊断一下新用户从注册到首次使用的真实用法，看看哪里会坑人"
  expect: [qa]
  strict: true
  rationale: "Explicit real-usage diagnosis."
  source: a20f32c

# --- acceptance: opt-in go/no-go ---

- id: acc-explicit
  prompt: "$acceptance 独立复核一下昨天的登录修复"
  expect: [acceptance]
  strict: true
  rationale: "Explicit invocation."
  source: design

- id: acc-gonogo
  prompt: "这个功能上线前做个最终验收，给个 go/no-go"
  expect: [acceptance]
  strict: true
  rationale: "Final acceptance verdict ask."
  source: design

- id: acc-verify-criteria
  prompt: "验证一下实现是否符合澄清过的需求，给出验收结论"
  expect: [acceptance]
  strict: true
  rationale: "Verification pass against clarified criteria."
  source: design

# --- clarify: opt-in product judgment ---

- id: clarify-whether-build
  prompt: "$clarify 我们要不要做这个功能"
  expect: [clarify]
  strict: true
  rationale: "Explicit invocation, build-or-not judgment."
  source: 9ca698a

- id: clarify-first-slice
  prompt: "这个需求第一期该怎么切？目标用户是谁？"
  expect: [clarify]
  strict: true
  rationale: "First slice and target users are clarify asks."
  source: 9ca698a

- id: clarify-prioritize
  prompt: "这两个产品机会怎么排优先级，关键取舍是什么"
  expect: [clarify]
  strict: true
  rationale: "Prioritization and tradeoffs."
  source: 9ca698a

- id: clarify-success-metric
  prompt: "成功指标怎么定？先做低成本实验还是直接开发？"
  expect: [clarify]
  strict: true
  rationale: "Success signal and low-cost experiment design."
  source: 9ca698a

- id: clarify-backlog-reject
  prompt: "帮我把 backlog 整理一下排个 sprint 计划"
  expect: [none]
  strict: true
  rationale: "Ongoing PM operations are explicitly out of clarify's scope."
  source: 9ca698a

