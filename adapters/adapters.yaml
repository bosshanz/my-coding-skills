# Per-CLI variables for the shared adapter contract in contract.md.
# display: full CLI name used in formal statements
# short:   prose name used inside sentences
# aliases: examples of explicit user selection

kimi-code:
  display: Kimi Code
  short: Kimi
  aliases: '“use Kimi Code”, “ask Kimi Code”'
claude-code:
  display: Claude Code
  short: Claude Code
  aliases: '“use Claude Code”, “ask Claude Code”'
codex-cli:
  display: Codex CLI
  short: Codex
  aliases: '“use Codex CLI”, “ask Codex CLI”'
opencode:
  display: OpenCode
  short: OpenCode
  aliases: '“use OpenCode”, “ask OpenCode”, “opencode”'
grok-build-cli:
  display: Grok Build CLI
  short: Grok
  aliases: '“use Grok”, “ask Grok”, “Grok Build”, “Grok CLI”, `grok`'
